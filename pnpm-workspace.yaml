packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  unrs-resolver: true
  sharp: true
  bcrypt: true

# Security floors for transitive dependencies (pnpm audit). Remove an entry
# once every parent package requires the patched version itself.
overrides:
  multer: ^2.4.0
  proxy-addr: ^2.0.8
  qs: ^6.16.0
  source-map-js: ^1.2.2
